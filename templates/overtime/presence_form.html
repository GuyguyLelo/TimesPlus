{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-intro">
  <p class="agent-kicker"><a href="{% url 'overtime:presences' %}">Liste des présences</a></p>
  <h1>{{ title }}</h1>
  <p>{{ intro }}</p>
</div>
<div class="card form-card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'overtime:presences' %}">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
