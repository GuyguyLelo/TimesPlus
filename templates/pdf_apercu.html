{% extends "base.html" %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
<div class="pdf-view">
  <div class="pdf-view-bar">
    <a class="btn btn-outline-primary" href="{{ retour }}"><i class="bi bi-arrow-left"></i> Retour</a>
    <h1>{{ titre }}</h1>
    <a class="btn btn-primary" href="{{ telecharger }}"><i class="bi bi-download"></i> Télécharger</a>
  </div>
  <iframe class="pdf-frame" src="{{ fichier }}" title="{{ titre }}"></iframe>
</div>
{% endblock %}
