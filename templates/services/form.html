{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card form-card"><div class="card-body">
  <h1 class="h4">{{ title }}</h1>
  <form method="post">{% csrf_token %}{% include "partials/form_fields.html" %}

      <a class="btn btn-outline-secondary" href="{% url 'services:list' %}">Annuler</a>
    </div>
  </form>
</div></div>
{% endblock %}
